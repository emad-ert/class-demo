<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه هوشمند مدیریت کلاس - نسخه دمو</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #1a252f; font-size: 20px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 4px; }
        .btn-nfc { background: #007bff; color: white; width: 100%; font-size: 16px; padding: 14px; }
        .student-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .present { background: #e8f5e9; color: #2e7d32; }
        .absent { background: #ffebee; color: #c62828; }
        .score { font-size: 18px; font-weight: bold; margin: 0 10px; color: #f39c12; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🏫 کلاس چهارم - سامانه هوشمند NFC (نسخه آزمایشی)</h1>
        <button class="btn btn-nfc" onclick="startNfcScan()">📱 اسکن تگ NFC با گوشی</button>
    </div>

    <div class="card">
        <h3>فهرست دانش‌آموزان (همگام‌سازی زنده)</h3>
        <div id="studentList">در حال دریافت اطلاعات...</div>
    </div>
</div>

<script>
    // ⚠️ آدرس ورکر کلادفلر خودت را اینجا قرار بده
    const WORKER_URL = "https://class-backend.emad-ert-laptop.workers.dev/";

    // دیتای آزمایشی اولیه
    let students = [
        { id: "A01", name: "علی محمدی (تست)", present: false, score: 0 },
        { id: "A02", name: "رضا حسینی (تست)", present: false, score: 0 },
        { id: "A03", name: "امیر کوهی (تست)", present: false, score: 0 },
        { id: "A04", name: "محمد کریمی (تست)", present: false, score: 0 },
        { id: "A05", name: "مهدی احمدی (تست)", present: false, score: 0 }
    ];

    // بارگذاری داده‌ها از کلادفلر
    async function loadData() {
        try {
            let res = await fetch(WORKER_URL + "/api/data");
            let data = await res.json();
            if (data) students = data;
            renderList();
        } catch (e) {
            console.error("خطا در دریافت داده", e);
            renderList();
        }
    }

    // ذخیره داده‌ها در کلادفلر
    async function saveData() {
        renderList();
        try {
            await fetch(WORKER_URL + "/api/update", {
                method: "POST",
                body: JSON.stringify(students)
            });
        } catch (e) {
            console.error("خطا در ذخیره داده", e);
        }
    }

    // رندر کردن لیست روی صفحه
    function renderList() {
        let html = "";
        students.forEach((s, index) => {
            html += `
                <div class="student-row">
                    <div>
                        <strong>[${s.id}] ${s.name}</strong>
                        <span class="badge ${s.present ? 'present' : 'absent'}">${s.present ? 'حاضر' : 'غایب'}</span>
                    </div>
                    <div>
                        <button class="btn" style="background:#2ecc71; color:white;" onclick="changeScore(${index}, 1)">+۱</button>
                        <span class="score">${s.score}</span>
                        <button class="btn" style="background:#e74c3c; color:white;" onclick="changeScore(${index}, -1)">-۱</button>
                        <button class="btn" style="background:#95a5a6; color:white;" onclick="togglePresent(${index})">تغییر وضعیت</button>
                    </div>
                </div>
            `;
        });
        document.getElementById("studentList").innerHTML = html;
    }

    function changeScore(index, val) {
        students[index].score += val;
        saveData();
    }

    function togglePresent(index) {
        students[index].present = !students[index].present;
        saveData();
    }

    // خواندن NFC با گوشی
    async function startNfcScan() {
        if ('NDEFReader' in window) {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                alert("سنسور NFC آماده اسکن است! تگ را به پشت گوشی نزدیک کنید.");
                ndef.addEventListener("reading", ({ serialNumber, message }) => {
                    for (const record of message.records) {
                        const textDecoder = new TextDecoder(record.encoding);
                        const tagId = textDecoder.decode(record.data).trim();
                        
                        let studentIndex = students.findIndex(s => s.id === tagId);
                        if (studentIndex !== -1) {
                            students[studentIndex].present = true;
                            students[studentIndex].score += 1;
                            saveData();
                            alert("حضور ثبت شد: " + students[studentIndex].name);
                        } else {
                            alert("تگ شناخته نشد: " + tagId);
                        }
                    }
                });
            } catch (error) {
                alert("خطا در فعال‌سازی NFC: " + error);
            }
        } else {
            alert("مرورگر شما از Web NFC پشتیبانی نمی‌کند یا اینترنت HTTPS نیست.");
        }
    }

    // دریافت خودکار اطلاعات هر ۲ ثانیه یک‌بار (همگام‌سازی زنده پروجکتور)
    setInterval(loadData, 2000);
    loadData();
</script>

</body>
</html>
